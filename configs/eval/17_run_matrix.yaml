# M4.7 eval matrix: 3 sigmas × 2 scenarios × 5 goal episodes = 30 runs.
ckpt: ~/.vitruvian/jepa_v5/best.pt
policy_ckpt: checkpoints/m1-g1-full/000043253760
vel_cmd: [0.5, 0.0, 0.0]
out_dir: /tmp/vitruvian/eval

runs:
  # Scenario A: original narrow dataset goals.
  - {scenario: orig,    h5_path: ~/.stable_worldmodel/g1_joystick_expert.h5,   goal_ep: 20, sigma: 0.0,  seed: 0}
  - {scenario: orig,    h5_path: ~/.stable_worldmodel/g1_joystick_expert.h5,   goal_ep: 20, sigma: 0.02, seed: 0}
  - {scenario: orig,    h5_path: ~/.stable_worldmodel/g1_joystick_expert.h5,   goal_ep: 20, sigma: 0.05, seed: 0}
  - {scenario: orig,    h5_path: ~/.stable_worldmodel/g1_joystick_expert.h5,   goal_ep: 30, sigma: 0.0,  seed: 0}
  - {scenario: orig,    h5_path: ~/.stable_worldmodel/g1_joystick_expert.h5,   goal_ep: 30, sigma: 0.02, seed: 0}
  - {scenario: orig,    h5_path: ~/.stable_worldmodel/g1_joystick_expert.h5,   goal_ep: 30, sigma: 0.05, seed: 0}
  - {scenario: orig,    h5_path: ~/.stable_worldmodel/g1_joystick_expert.h5,   goal_ep: 40, sigma: 0.0,  seed: 0}
  - {scenario: orig,    h5_path: ~/.stable_worldmodel/g1_joystick_expert.h5,   goal_ep: 40, sigma: 0.02, seed: 0}
  - {scenario: orig,    h5_path: ~/.stable_worldmodel/g1_joystick_expert.h5,   goal_ep: 40, sigma: 0.05, seed: 0}
  - {scenario: orig,    h5_path: ~/.stable_worldmodel/g1_joystick_expert.h5,   goal_ep: 50, sigma: 0.02, seed: 0}
  - {scenario: orig,    h5_path: ~/.stable_worldmodel/g1_joystick_expert.h5,   goal_ep: 60, sigma: 0.02, seed: 0}
  # Scenario B: diverse-grid dataset goals.
  - {scenario: diverse, h5_path: ~/.stable_worldmodel/g1_diverse_v1.h5,         goal_ep: 20, sigma: 0.0,  seed: 0}
  - {scenario: diverse, h5_path: ~/.stable_worldmodel/g1_diverse_v1.h5,         goal_ep: 20, sigma: 0.02, seed: 0}
  - {scenario: diverse, h5_path: ~/.stable_worldmodel/g1_diverse_v1.h5,         goal_ep: 20, sigma: 0.05, seed: 0}
  - {scenario: diverse, h5_path: ~/.stable_worldmodel/g1_diverse_v1.h5,         goal_ep: 40, sigma: 0.0,  seed: 0}
  - {scenario: diverse, h5_path: ~/.stable_worldmodel/g1_diverse_v1.h5,         goal_ep: 40, sigma: 0.02, seed: 0}
  - {scenario: diverse, h5_path: ~/.stable_worldmodel/g1_diverse_v1.h5,         goal_ep: 40, sigma: 0.05, seed: 0}
