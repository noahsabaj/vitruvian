# LeWM Hydra data config for Vitruvian's G1 joystick-walking dataset.
#
# Written into the submodule as a local modification. To regenerate after
# re-checkout: this file. For version control of the config itself, see
# scripts/m4_collect_g1_rollouts.py which writes the referenced dataset
# at ~/.stable_worldmodel/g1_joystick_expert.h5 .
dataset:
  num_steps: ${eval:'${wm.num_preds} + ${wm.history_size}'}
  # G1 control runs at 50 Hz. tworoom/pusht use frameskip 5 on ~100 Hz
  # data (= 20 Hz). We keep frameskip=1 for the first attempt — humanoid
  # balance dynamics want dense sampling, and we can increase later.
  frameskip: 1
  name: g1_joystick_expert
  keys_to_load:
    - pixels
    - action
    - proprio
    - state
  keys_to_cache:
    # state + proprio + action are cheap to keep fully in RAM; pixels
    # stream from HDF5 on demand.
    - action
    - proprio
    - state
