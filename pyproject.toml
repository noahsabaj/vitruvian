[project]
name = "vitruvian"
version = "0.4.8"
description = "Minimum viable humanoid as a substrate for machine intelligence."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "noahsabaj", email = "noahsabaj@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "brax>=0.14.2",
    "einops>=0.8.2",
    "h5py>=3.16.0",
    "imageio>=2.37.3",
    "jax[cuda12]>=0.10.0",
    "mujoco>=3.7.0",
    "mujoco-mjx>=3.7.0",
    "mujoco-warp>=3.7.0.1",
    "playground>=0.2.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.5.4",
    "wandb>=0.26.0",
    "warp-lang>=1.12.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
vitruvian = "vitruvian:main"
vit-train = "vitruvian.cli.train:main"
vit-plan = "vitruvian.cli.plan:main"
vit-eval = "vitruvian.cli.eval:main"
vit-collect = "vitruvian.cli.collect:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
# Scope pytest to our first-party tests only. Without this, bare
# `pytest` would also collect the 96 vendor tests under
# external/mujoco_menagerie/test/, which couples our CI to upstream.
testpaths = ["tests"]

