[project]
name = "vitruvian"
version = "0.4.8"
description = "Minimum viable humanoid as a substrate for machine intelligence."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "noahsabaj", email = "noahsabaj@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "brax>=0.14.2",
    "einops>=0.8.2",
    "h5py>=3.16.0",
    "imageio>=2.37.3",
    "jax[cuda12]>=0.10.0",
    "mujoco>=3.7.0",
    "mujoco-mjx>=3.7.0",
    "mujoco-warp>=3.7.0.1",
    "playground>=0.2.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.5.4",
    "wandb>=0.26.0",
    "warp-lang>=1.12.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "types-PyYAML",
]

[project.scripts]
vitruvian = "vitruvian:main"
vit-train = "vitruvian.cli.train:main"
vit-plan = "vitruvian.cli.plan:main"
vit-eval = "vitruvian.cli.eval:main"
vit-collect = "vitruvian.cli.collect:main"
vit-rollout = "vitruvian.cli.rollout:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
# Scope pytest to our first-party tests only. Without this, bare
# `pytest` would also collect the 96 vendor tests under
# external/mujoco_menagerie/test/, which couples our CI to upstream.
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/vitruvian"]
# These are the third-party libraries we depend on that don't ship
# type stubs (or whose stubs are incomplete enough that strict fails).
# Missing-import errors are noise; we still type-check our own usage.
[[tool.mypy.overrides]]
module = [
    "brax.*",
    "einops.*",
    "h5py.*",
    "jax.*",
    "mediapy.*",
    "mujoco.*",
    "mujoco_playground.*",
    "mujoco_warp.*",
    "scipy.*",
    "torchvision.*",
    "transformers.*",
    "warp.*",
]
ignore_missing_imports = true

# Vendored LeWM code — kept close to upstream intentionally; not worth
# re-typing against our strict style.
[[tool.mypy.overrides]]
module = ["vitruvian.lewm_compat.*"]
ignore_errors = true

# Glue layers (CLI entry points + heavy JAX/MuJoCo/brax orchestration)
# are mostly dict[str, Any] + untyped third-party calls. Strict-typing
# them yields diminishing returns; keep strict on the library core.
[[tool.mypy.overrides]]
module = [
    "vitruvian.cli.*",
    "vitruvian.env.*",
    "vitruvian.data.collection",
]
disable_error_code = [
    "type-arg",
    "no-untyped-def",
    "no-untyped-call",
    "no-any-return",
    "union-attr",
    "assignment",
    "unused-ignore",
]

